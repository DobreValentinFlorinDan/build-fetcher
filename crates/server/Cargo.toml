[package]
name = "bf-server"
version.workspace = true
edition.workspace = true
publish = false
description = "Build Fetcher's local server: REST + /ws on 127.0.0.1, the League client (LCU) and the Live Client, champ select and in-game advice over the BuildSource contract."

[lib]
name = "bf_server"

[[bin]]
name = "bf-server"
path = "src/main.rs"

[dependencies]
bf-core = { path = "../core" }
bf-store = { path = "../store" }
bf-learn = { path = "../learn" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { workspace = true, features = ["ws"] }
parking_lot.workspace = true
indexmap.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
regex-lite = "0.1"
tower-http = { version = "0.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile.workspace = true
