filetime.workspace = true
indexmap.workspace = true
reqwest.workspace = true
tokio.workspace = true
mimalloc = { version = "0.1.52", default-features = false }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["full", "test-util"] }
