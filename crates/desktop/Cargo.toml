[package]
name = "bf-desktop"
version.workspace = true
edition.workspace = true
publish = false
description = "Build Fetcher's desktop shell logic without a window toolkit (settings, keep awake, the /ws feed, overlay placement, renderer priority), so it builds and tests anywhere; desktop/tauri puts it on screen."

[lib]
name = "bf_desktop"

[dependencies]
bf-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite = "0.24"
sysinfo.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["full", "test-util"] }
