[package]
name = "irelia-desktop"
version.workspace = true
edition.workspace = true
publish = false
description = "The desktop shell's logic without a window toolkit (settings, keep awake, leftover middleware, the /ws feed, overlay placement), so it builds and tests anywhere; desktop/tauri puts it on screen."

[dependencies]
irelia = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite = "0.24"
sysinfo.workspace = true
chrono.workspace = true
rusty-leveldb = { version = "4", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["full", "test-util"] }
